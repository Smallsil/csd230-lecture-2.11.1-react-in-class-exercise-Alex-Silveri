spring.application.name=Bookstore

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

server.port=${PORT:8080}


# Show SQL logs (helpful for debugging the tutorial)
spring.jpa.show-sql=true
# Ensure tables are created based on your Entity classes
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Console (at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

spring.h2.console.settings.web-allow-others=true